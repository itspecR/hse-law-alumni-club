[project]
name = "club-ops"
version = "0.1.0"
description = "Команды оператора Клуба выпускников"
requires-python = ">=3.14,<3.15"
dependencies = ["club-api==0.1.0"]

[project.scripts]
club-ops = "club_ops.cli:run"

[tool.uv.sources]
club-api = { path = "../backend" }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["club_ops"]

[tool.hatch.build.targets.wheel.force-include]
"../data/dpo-catalog.json" = "club_ops/data/catalog.json"
"../data/campaign-templates.json" = "club_ops/data/campaign-templates.json"
