[project]
name = "club-web"
version = "0.1.0"
description = "Сайт Клуба выпускников факультета права НИУ ВШЭ"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "django==6.1.2",
    "gunicorn==26.2.0",
    "markdown-it-py==4.2.0",
    "nh3==0.3.7",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
    "playwright==1.63.0",
    "pip-audit==2.10.1",
    "tree-sitter==0.26.0",
    "tree-sitter-javascript==0.25.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["club_web"]

[tool.hatch.build.targets.wheel.force-include]
"../data/domain-data.json" = "club_web/data/domain-data.json"
"../data/legal-data.json" = "club_web/data/legal-data.json"
"../data/faq-data.json" = "club_web/data/faq-data.json"
"../data/changes.json" = "club_web/data/changes.json"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"../scripts/diagnostics/security-inventory.py" = ["S603"]
"../scripts/checks/check-image-audit.py" = ["S603"]
"club_web/rich_text.py" = ["S704"]

[tool.ruff.per-file-target-version]
"../scripts/diagnostics/security-inventory.py" = "py312"
"../scripts/checks/check-image-audit.py" = "py312"
"../scripts/tests/test-security-inventory.py" = "py312"
