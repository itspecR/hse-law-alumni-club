<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Нет сети – Клуб выпускников</title>
    <script src="./assets/offline.js" defer></script>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
        font-family: "HSE Sans", system-ui, sans-serif;
        background: #000000;
        color: #f5f5f7;
      }
      main {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 12px;
        background: #ea6806;
        display: grid;
        place-items: center;
      }
      .mark img { width: 36px; height: 36px; }
      h1 {
        margin: 0 0 10px;
        font-size: 1.35rem;
        font-weight: 400;
        line-height: 1.2;
      }
      p {
        margin: 0 0 22px;
        font-size: 0.95rem;
        line-height: 1.5;
        color: #a1a1a6;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 999px;
        min-height: 48px;
        padding: 0 26px;
        font: inherit;
        font-weight: 600;
        font-size: 0.95rem;
        background: #ea6806;
        color: #111111;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #f5f5f7;
        outline-offset: 3px;
      }
      a { color: #6f9bd8; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <img src="./icon-192.png" alt="" width="36" height="36" />
      </div>
      <h1>Нет подключения</h1>
      <p>Эта страница не сохранена для чтения без интернета. Ранее открытые новости, программы, товары и события доступны в течение семи дней.</p>
      <p><a href="./saved">Сохранённые материалы и история чтения</a></p>
      <p>Для входа, заявок и оплаты нужен интернет.</p>
      <button type="button" id="offline-reload">Обновить</button>
    </main>
  </body>
</html>
