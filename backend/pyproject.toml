[project]
name = "club-api"
version = "0.1.0"
description = "API Клуба выпускников факультета права НИУ ВШЭ"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic-settings==2.15.0",
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
  "PyJWT==2.15.1",
  "argon2-cffi==25.1.0",
  "httpx==0.28.1",
  "pillow==13.0.0",
  "beautifulsoup4==4.15.0",
  "pywebpush==2.5.0",
  "aiohttp==3.14.5",
  "aiosmtplib==5.1.3",
  "sentry-sdk==2.71.0",
  "django==6.1.2",
  "django-ninja==1.7.1",
  "gunicorn==26.2.0",
  "mysqlclient==2.3.0",
  "bcrypt==5.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
    "pip-audit==2.10.1",
    "pytest-django==4.14.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["club_api"]

[tool.hatch.build.targets.wheel.force-include]
"../data/domain-data.json" = "club_api/domain-data.json"
"../data/legal-data.json" = "club_api/legal-data.json"
"../data/faq-data.json" = "club_api/faq-data.json"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "club_api.django_settings"
testpaths = ["tests/python"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["../scripts"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.per-file-target-version]
"../scripts/lib/mariadb_*.py" = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"../scripts/lib/mariadb_native.py" = ["S603", "S608", "S104"]
"../scripts/lib/mariadb_common.py" = ["S603", "S608"]
"../scripts/lib/mariadb_backup.py" = ["S603", "S608"]
"../scripts/lib/mariadb_install.py" = ["S608", "S104"]
"../scripts/tests/test-nginx.py" = ["S603", "S108"]
"tests/**" = ["S105", "S106"]
"club_api/core/config.py" = ["S104"]
"club_api/db/store.py" = ["S608"]
"club_api/modules/media/service.py" = ["S608"]
"club_api/modules/notifications/push.py" = ["ASYNC109"]
"club_api/modules/telegram/bot.py" = ["ASYNC109"]
