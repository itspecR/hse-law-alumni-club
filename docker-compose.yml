name: club-pravo-hse

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    build:
      context: .
      dockerfile: deploy/postgres.Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    logging: *default-logging

  bootstrap:
    build:
      context: .
      dockerfile: deploy/bootstrap.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_ENV: ${APP_ENV:-development}
      SEED_DEMO: ${SEED_DEMO:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TEST_EDITOR_EMAIL: ${TEST_EDITOR_EMAIL:-}
      TEST_EDITOR_PASSWORD: ${TEST_EDITOR_PASSWORD:-}
      TEST_ALUMNI_EMAIL: ${TEST_ALUMNI_EMAIL:-}
      TEST_ALUMNI_PASSWORD: ${TEST_ALUMNI_PASSWORD:-}
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: deploy/postgres.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CHECKOUT_DB_USER: ${CHECKOUT_DB_USER:-club_api}
      CHECKOUT_DB_PASSWORD: ${CHECKOUT_DB_PASSWORD:-}
    volumes:
      - ./backend/migrations:/migrations:ro
      - ./backend/sql/indexes.sql:/indexes.sql:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
      - ./backend/sql/runtime-role.sql:/runtime-role.sql:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      API_PORT: "3000"
      UPLOADS_PATH: /data/uploads
      CHECKOUT_DATABASE_URL: ${CHECKOUT_DATABASE_URL:-postgresql://${CHECKOUT_DB_USER:-club_api}:${CHECKOUT_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      SUPPORT_OPERATOR_NAME: "${SUPPORT_OPERATOR_NAME:-Автономная некоммерческая организация «Клуб выпускников факультета права НИУ ВШЭ»}"
      SUPPORT_OPERATOR_ADDRESS: "${SUPPORT_OPERATOR_ADDRESS:-107061, г. Москва, ул. Большая Черкизовская, д. 3, к. 2, помещ. 17/1}"
      SUPPORT_OPERATOR_CONTACT: "${SUPPORT_OPERATOR_CONTACT:-Письменное обращение по юридическому адресу оператора}"
      SUPPORT_ENABLED: ${SUPPORT_ENABLED:-false}
      SUPPORT_RETENTION_DAYS: ${SUPPORT_RETENTION_DAYS:-30}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      DPO_SYNC_ENABLED: ${DPO_SYNC_ENABLED:-true}
      DPO_SITE_URL: ${DPO_SITE_URL:-}
      DPO_SITE_CERTIFICATE: ${DPO_SITE_CERTIFICATE:-}
      DPO_SITE_LINK_URL: ${DPO_SITE_LINK_URL:-}
      NEWS_SYNC_ENABLED: ${NEWS_SYNC_ENABLED:-false}
      TELEGRAM_REACTIONS_CHAT_ID: ${TELEGRAM_REACTIONS_CHAT_ID:-}
      OFFICE_EMAIL: ${OFFICE_EMAIL:-}
      POINTS_SERVICE_TOKEN: ${POINTS_SERVICE_TOKEN:-}
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-pravohse_alumni_bot}
      TELEGRAM_POLLING: ${TELEGRAM_POLLING:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OFFICE_NOTIFY_CHANNEL: ${OFFICE_NOTIFY_CHANNEL}
      OFFICE_TG_BOT_TOKEN: ${OFFICE_TG_BOT_TOKEN}
      OFFICE_TG_CHAT_ID: ${OFFICE_TG_CHAT_ID}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_ENV: ${APP_ENV:-development}
      SEED_DEMO: ${SEED_DEMO:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      ORDER_RETENTION_DAYS: ${ORDER_RETENTION_DAYS:-1095}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}
      RESERVE_TTL_HOURS: ${RESERVE_TTL_HOURS:-72}
      MAIL_OUTBOX_MAX_ATTEMPTS: ${MAIL_OUTBOX_MAX_ATTEMPTS:-8}
    volumes:
      - directus_uploads:/data/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 512m
    stop_grace_period: 30s
    logging: *default-logging

  web:
    environment:
      API_INTERNAL_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    logging: *default-logging

  caddy:
    build:
      context: .
      dockerfile: deploy/edge.Dockerfile
      target: caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - web
      - api
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    logging: *default-logging

volumes:
  pgdata:
  directus_uploads:
  caddy_data:
  caddy_config:
