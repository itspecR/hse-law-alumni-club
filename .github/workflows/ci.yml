name: Security & CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.8"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.0"
      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmariadb-dev pkg-config
          uv sync --directory backend --frozen
          uv sync --directory scripts --frozen

      - name: Install web dependencies and Chromium
        run: |
          uv sync --directory frontend --frozen
          uv run --directory frontend playwright install --with-deps chromium
      - name: Check Python and browser source
        run: |
          uv run --directory backend python manage.py check
          uv run --directory frontend python manage.py check
          uv run --directory backend ruff check club_api tests/python ../scripts/club_ops
          uv run --directory backend ruff format --check club_api tests/python ../scripts/club_ops
          uv run --directory backend ruff check ../scripts/lib/mariadb_common.py ../scripts/lib/mariadb_install.py ../scripts/lib/mariadb_backup.py ../scripts/lib/mariadb_native.py ../scripts/lib/autodeploy.py ../scripts/tests/test-autodeploy.py
          uv run --directory backend ruff format --check ../scripts/lib/mariadb_common.py ../scripts/lib/mariadb_install.py ../scripts/lib/mariadb_backup.py ../scripts/lib/mariadb_native.py ../scripts/lib/autodeploy.py ../scripts/tests/test-autodeploy.py
          uv run --directory frontend ruff check club_web tests/python
          uv run --directory frontend ruff format --check club_web tests/python
          uv run --directory frontend python ../scripts/checks/check-comments.py
          uv run --directory frontend python ../scripts/checks/check-text-style.py
      - name: Validate operator commands and deployment configuration
        run: |
          while IFS= read -r -d '' script; do bash -n "$script"; done < <(find scripts -type d -name .venv -prune -o -type f -name '*.sh' -print0)
          python3 scripts/tests/test-ops.py
          python3 scripts/tests/test-install.py
          python3 scripts/tests/test-mariadb-ops.py
          python3 scripts/tests/test-image-builds.py
          sudo python3 scripts/tests/test-deploy-entrypoint.py
          python3 scripts/tests/test-autodeploy.py
          python3 scripts/tests/test-security-inventory.py
          uv run --directory frontend ruff check ../scripts/diagnostics/security-inventory.py ../scripts/checks/check-image-audit.py ../scripts/tests/test-security-inventory.py
          uv run --directory frontend ruff format --check ../scripts/diagnostics/security-inventory.py ../scripts/checks/check-image-audit.py ../scripts/tests/test-security-inventory.py
          uv run --directory backend python ../scripts/tests/test-measure-load.py
          uv run --directory frontend python ../scripts/tests/test-comments.py
          uv run --directory frontend python ../scripts/tests/test-text-style.py
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example config --format json | python3 scripts/checks/check-compose.py
      - name: Build and check native web files
        run: |
          uv run --directory frontend python -m club_web.build --output /tmp/club-native-web
          uv run --directory frontend python ../scripts/checks/check-web-build.py /tmp/club-native-web
      - name: Test API, templates and browser flows
        run: |
          uv run --directory backend pytest -q
          uv run --directory frontend pytest -q
      - name: Audit Python runtime and development dependencies
        run: bash scripts/checks/audit-dependencies.sh security-reports
      - name: Save dependency evidence for this commit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-security-${{ github.sha }}
          path: security-reports/
          retention-days: 7
          if-no-files-found: warn

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.8"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.0"
      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmariadb-dev pkg-config
          uv sync --directory backend --frozen
          uv sync --directory scripts --frozen
      - name: Python API against disposable PostgreSQL
        run: bash scripts/tests/test-integration.sh

  mariadb-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.8"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.0"
      - name: Install MariaDB from Ubuntu and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mariadb-server libmariadb-dev pkg-config
          sudo systemctl start mariadb
          uv sync --directory backend --frozen
          uv sync --directory scripts --frozen
      - name: Prepare a disposable database
        run: |
          sudo mariadb <<'SQL'
          CREATE DATABASE django_migration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;
          CREATE USER 'club_test_operator'@'localhost' IDENTIFIED BY 'synthetic-mariadb-operator-test-only';
          GRANT ALL PRIVILEGES ON django_migration_test.* TO 'club_test_operator'@'localhost' WITH GRANT OPTION;
          GRANT CREATE USER ON *.* TO 'club_test_operator'@'localhost';
          SQL
      - name: Check Django migrations, restricted API role and application behavior
        env:
          CLUB_TEST_DATABASE_URL: mariadb://club_test_operator:synthetic-mariadb-operator-test-only@127.0.0.1:3306/django_migration_test
        run: bash scripts/tests/test-mariadb-integration.sh

  live-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.8"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.13.0"
      - name: Install browser tests
        run: |
          uv sync --directory frontend --frozen
          uv run --directory frontend playwright install --with-deps chromium
      - name: Build images and check real persistence in desktop and mobile browsers
        run: bash scripts/tests/test-live.sh
      - name: Check final runtime image contents
        run: bash scripts/checks/check-runtime-images.sh club-ci-live-api club-ci-live-bootstrap club-ci-live-web
      - name: Check Caddy and reachable Go vulnerabilities
        run: docker build --file deploy/edge.Dockerfile --target edge-check --tag club-ci-edge-check .
      - name: Check Caddy TLS and perimeter with final images
        run: python3 scripts/tests/test-edge.py --edge-image club-ci-live-caddy --web-image club-ci-live-web --api-image club-ci-live-api
      - name: Check nginx TLS, request limits and proxy headers
        run: |
          docker build --file deploy/nginx.Dockerfile --build-arg "VCS_REF=$(git rev-parse HEAD)" --tag club-ci-live-nginx .
          python3 scripts/tests/test-nginx.py --application-image club-ci-live-api --edge-image club-ci-live-nginx
      - name: Scan application images and retain every severity
        run: |
          mkdir -m 0700 security-reports
          mkdir -m 0700 /tmp/club-image-raw
          status=0
          for service in api bootstrap web caddy postgres nginx; do
            report="trivy-$service.json"
            if ! docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v /tmp/club-image-raw:/reports \
              aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --scanners vuln --list-all-pkgs --format json --output "/reports/$report" --exit-code 0 "club-ci-live-$service"; then
              status=1
              continue
            fi
            if ! python3 scripts/checks/check-image-audit.py "/tmp/club-image-raw/$report" --image "club-ci-live-$service" --output "security-reports/$report"; then status=1; fi
          done
          exit "$status"
      - name: Save image evidence for this commit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-security-${{ github.sha }}
          path: security-reports/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove MySQL preinstalled on the runner image
        run: |
          sudo systemctl stop mysql || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get purge -y 'mysql-server*' 'mysql-client*' mysql-common
          sudo rm -rf /etc/mysql /var/lib/mysql
      - name: Install, repeat and restore MariaDB on Ubuntu with local TLS
        run: CLUB_NATIVE_BROWSER=true bash scripts/tests/test-install.sh

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Scan repository files with Gitleaks
        run: >-
          docker run --rm --network none --read-only
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir /repo --config /repo/.gitleaks.toml --redact --no-banner
