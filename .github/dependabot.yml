version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Moscow
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directories:
      - "/deploy"
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Moscow
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: uv
    directories: ["/backend", "/frontend", "/scripts"]
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    allow:
      - dependency-type: all
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(python)"
